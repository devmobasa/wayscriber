"\"Auto\" uses dark. \"Light\" supports the command palette, including shortcut editing and tooltips; other popups still use dark." = "\"自动\"使用深色。\"浅色\"支持命令面板，包括快捷键编辑和提示；其他弹出窗口仍使用深色。"
"\"On\" disables UI animations. \"Auto\" follows the system preference in a future release and keeps full motion for now." = "\"开\"将关闭界面动画。\"自动\"将在未来版本中跟随系统偏好，目前保持完整动效。"
"\"Overlay only\" shows what Wayscriber itself receives. \"System-wide\" also shows input that goes to other apps; it needs a build with the input-monitor feature and read access to /dev/input (usually `input` group membership), and it sees every keystroke on the seat - including passwords typed elsewhere." = "\"仅叠层\"只显示 Wayscriber 自己收到的输入。\"系统全局\"还会显示发送到其他应用的输入；它需要带有 input-monitor 特性的构建以及对 /dev/input 的读取权限（通常需要加入 `input` 用户组），并且会看到该席位上的每一次按键——包括在其他地方输入的密码。"
