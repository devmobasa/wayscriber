# Simplified Chinese UI strings for wayscriber.
#
# Keys are the English source strings the UI draws; values are what
# `[ui] language = "zh-CN"` shows instead. A key that is missing here
# stays English at runtime, and
# `cargo test --test repository_guards translations` lists every gap.

" Nothing is written until you press Save." = " 在你按下保存之前不会写入任何内容。"
"\"{}\" is not installed on this system" = "此系统未安装“{}”"
"\nBackup created at {}" = "\n已在 {} 创建备份"
"\nConflicting shortcuts were resolved for the running session only; the file still has them: {}." = "\n冲突的快捷键已仅为本次运行时段解决，文件中仍然保留它们：{}。"
"\nNew default shortcuts stayed inactive because this configuration already uses those keys: {}." = "\n由于此配置已占用这些按键，新默认快捷键未生效：{}。"
"\nRetired toolbar settings were preserved but are no longer used and can be removed: {}." = "\n已停用的工具栏设置被保留，但不再使用，可以删除：{}。"
"\nShortcuts that could not be parsed are ignored for the running session; the file still has them: {}." = "\n无法解析的快捷键在本次运行时段被忽略，文件中仍然保留它们：{}。"
"\nThe loaded configuration did not come back from the failed write. Reload before saving again." = "加载的配置未能从失败的写入中恢复。请重新加载后再保存。"
