# Fixture, not a live workflow. The contract-complete workflow plus a driver
# call for a consumer no longer declared in tools/cargo-lanes.json. The driver
# would fail at run time, but only after the job reached that step; the entry
# point contract is what catches a renamed or deleted consumer while the
# workflow that calls it is still being read.
name: Checks (fixture)

jobs:
  lint-and-test:
    name: Rust lint and test
    steps:
      - name: Check dynamic gtk4-layer-shell linkage
        run: |
          cargo build --locked --bin wayscriber
          readelf -d target/debug/wayscriber | grep -Eq 'Shared library: \[libgtk4-layer-shell\.so'

      - name: Check Cargo lane contract
        run: |
          ./tools/check-cargo-lanes.py --self-test
          ./tools/check-cargo-lanes.py

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo lane matrix
        run: ./tools/run-cargo-consumer.py ci-ubuntu

      - name: Cargo lane matrix (fast)
        run: ./tools/run-cargo-consumer.py ci-ubuntu-fast

      - name: Check static gtk4-layer-shell linkage
        env:
          SYSTEM_DEPS_GTK4_LAYER_SHELL_0_LINK: static
        run: |
          cargo build --locked --bin wayscriber
          bash tools/verify-static-gtk4-layer-shell.sh target/debug/wayscriber

  configurator-modern-arch:
    name: Configurator modern (Arch)
    container: archlinux:latest
    steps:
      - name: Cargo lane matrix (modern)
        run: ./tools/run-cargo-consumer.py ci-arch
