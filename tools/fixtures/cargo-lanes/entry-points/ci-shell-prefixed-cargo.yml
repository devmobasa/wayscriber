# Fixture, not a live workflow. Four raw Cargo commands are hidden behind
# ordinary shell syntax: a control word plus builtin, wrappers whose options
# consume operands, and a shell evaluator whose `-c` operand is another command.
name: Checks (fixture)

jobs:
  lint-and-test:
    name: Rust lint and test
    steps:
      - name: Check dynamic gtk4-layer-shell linkage
        run: |
          cargo build --locked --bin wayscriber
          readelf -d target/debug/wayscriber | grep -Eq 'Shared library: \[libgtk4-layer-shell\.so'

      - name: Check Cargo lane contract
        run: |
          ./tools/check-cargo-lanes.py --self-test
          ./tools/check-cargo-lanes.py

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: shell control prefix
        run: if command cargo build --workspace --bins; then true; fi

      - name: env option operand
        run: env -u RUSTFLAGS cargo check --workspace --all-targets

      - name: sudo option operand
        run: sudo -u builder cargo doc --workspace --no-deps

      - name: shell evaluator
        run: bash -c 'cargo bench --workspace --no-run'

      - name: Cargo lane matrix
        run: ./tools/run-cargo-consumer.py ci-ubuntu

      - name: Check static gtk4-layer-shell linkage
        env:
          SYSTEM_DEPS_GTK4_LAYER_SHELL_0_LINK: static
        run: |
          cargo build --locked --bin wayscriber
          bash tools/verify-static-gtk4-layer-shell.sh target/debug/wayscriber

  configurator-modern-arch:
    name: Configurator modern (Arch)
    container: archlinux:latest
    steps:
      - name: Cargo lane matrix (modern)
        run: ./tools/run-cargo-consumer.py ci-arch
