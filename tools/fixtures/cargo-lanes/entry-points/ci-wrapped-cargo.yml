# Fixture, not a live workflow. The second shape of the same evasion: the raw
# command runs under a wrapper program with its own operands
# (`timeout -k 10 300 ...`), so the head of the line is `timeout` and the head
# of the command is not read at all unless the wrapper's tokens are skipped
# first. A path-qualified `cargo` in the second step covers the other half:
# spelling the program with a directory must not launder it either.
name: Checks (fixture)

jobs:
  lint-and-test:
    name: Rust lint and test
    steps:
      - name: Check dynamic gtk4-layer-shell linkage
        run: |
          cargo build --locked --bin wayscriber
          readelf -d target/debug/wayscriber | grep -Eq 'Shared library: \[libgtk4-layer-shell\.so'

      - name: Check Cargo lane contract
        run: |
          ./tools/check-cargo-lanes.py --self-test
          ./tools/check-cargo-lanes.py

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: extra test
        run: timeout -k 10 300 cargo test --workspace --all-features

      - name: extra build
        run: /usr/bin/cargo build --workspace --bins

      - name: Cargo lane matrix
        run: ./tools/run-cargo-consumer.py ci-ubuntu

      - name: Check static gtk4-layer-shell linkage
        env:
          SYSTEM_DEPS_GTK4_LAYER_SHELL_0_LINK: static
        run: |
          cargo build --locked --bin wayscriber
          bash tools/verify-static-gtk4-layer-shell.sh target/debug/wayscriber

  configurator-modern-arch:
    name: Configurator modern (Arch)
    container: archlinux:latest
    steps:
      - name: Cargo lane matrix (modern)
        run: ./tools/run-cargo-consumer.py ci-arch
