name: Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    name: Rust lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            clang \
            cmake \
            libssl-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libdbus-1-dev \
            libinput-dev \
            libudev-dev \
            libgtk-3-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            meson \
            ninja-build \
            wayland-protocols \
            libpango1.0-dev \
            libcairo2-dev \
            libpixman-1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb-randr0-dev \
            libxcb1-dev \
            libx11-dev

      - name: Build gtk4-layer-shell
        # Build both forms privately: normal CI exercises the dynamic source
        # build used by AUR/Nix, and a dedicated step checks release linkage.
        run: |
          GTK4_LAYER_SHELL_PREFIX="$RUNNER_TEMP/gtk4-layer-shell" \
          GTK4_LAYER_SHELL_LIBRARY_MODE=both \
            bash tools/install-gtk4-layer-shell.sh
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/gtk4-layer-shell/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/gtk4-layer-shell/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Check version metadata
        run: bash tools/check-version-consistency.sh

      - name: Check package repository layout
        run: bash tools/test-package-repo-layout.sh

      - name: Check release packaging contract
        run: bash tools/test-release-packaging.sh

      - name: Check dynamic gtk4-layer-shell linkage
        run: |
          cargo build --locked --bin wayscriber
          readelf -d target/debug/wayscriber | grep -Eq 'Shared library: \[libgtk4-layer-shell\.so'

      - name: Check nixpkgs recipe dependencies
        run: ./tools/check-nixpkgs-recipe.py

      - name: Check AUR templates
        # The external wayscriber-configurator recipe is owned here as a template
        # pair. This gate needs no makepkg, so it runs on every PR; the Arch job
        # adds the canonical makepkg comparison on top. The self-test replays the
        # fixtures for the two rules a healthy tree cannot exercise.
        run: |
          ./tools/check-aur-templates.py --self-test
          ./tools/check-aur-templates.py

      - name: Check Cargo lane contract
        run: |
          ./tools/check-cargo-lanes.py --self-test
          ./tools/check-cargo-lanes.py

      - name: Check Rust source coverage
        run: ./tools/check-rust-source-coverage.py

      - name: Check process spawn sites
        run: ./tools/check-process-sites.py

      - name: Check config writers
        run: ./tools/check-config-writers.py

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo lane matrix
        # Lanes, flags, and order live in tools/cargo-lanes.json; edit the
        # manifest, never this step.
        run: ./tools/run-cargo-consumer.py ci-ubuntu

      - name: Check static gtk4-layer-shell linkage
        env:
          SYSTEM_DEPS_GTK4_LAYER_SHELL_0_LINK: static
        run: |
          cargo build --locked --bin wayscriber
          bash tools/verify-static-gtk4-layer-shell.sh target/debug/wayscriber

      - name: Record code health
        if: always()
        continue-on-error: true
        run: |
          ./tools/code-health-report.sh > code-health-report.txt
          sed -n '1,/^$/p' code-health-report.txt

      - name: Upload code-health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayscriber-code-health
          path: code-health-report.txt
          if-no-files-found: warn

  configurator-modern-arch:
    name: Configurator modern (Arch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
    steps:
      # Before checkout on purpose: the base image ships neither git (which
      # actions/checkout needs) nor python, jq, or a Rust toolchain.
      - name: Bootstrap Arch container
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git python jq rustup pkgconf gcc shadow util-linux \
            gtk4 libadwaita glib2 cairo pango gdk-pixbuf2 graphene \
            wayland libxkbcommon
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cargo lane matrix (modern libadwaita)
        # config-modern is the only lane that compiles `adw-modern`. It needs a
        # libadwaita runtime of at least 1.7, which Ubuntu 24.04 does not ship,
        # so this job is where that channel is built, linted, and tested.
        run: ./tools/run-cargo-consumer.py ci-arch

      - name: Prepare unprivileged makepkg user
        # makepkg refuses to run as root and aborts with E_FS_PERMISSIONS on a
        # root-owned working directory, so the canonical .SRCINFO comparisons
        # below run as `builder` in a directory that belongs to `builder`.
        # `--printsrcinfo` needs no fakeroot and builds nothing.
        run: |
          useradd -m builder
          install -d -o builder -g builder /tmp/srcinfo-canonical

      - name: Check AUR templates
        run: ./tools/check-aur-templates.py

      - name: Canonical .SRCINFO - checked-in packaging pair
        # packaging/.SRCINFO is generated but committed by hand, so nothing else
        # notices a PKGBUILD edit that never reached it.
        run: |
          ./tools/check-srcinfo-canonical.py \
            --pkgbuild packaging/PKGBUILD \
            --srcinfo packaging/.SRCINFO \
            --label 'packaging/PKGBUILD vs packaging/.SRCINFO' \
            --builder-user builder \
            --work-root /tmp/srcinfo-canonical \
            --refresh-task './tools/bump-version.sh (it regenerates packaging/.SRCINFO)'

      - name: Canonical .SRCINFO - AUR template pair (normal release)
        run: |
          ./tools/check-srcinfo-canonical.py \
            --pkgbuild packaging/aur/wayscriber-configurator/PKGBUILD.tmpl \
            --srcinfo packaging/aur/wayscriber-configurator/.SRCINFO.tmpl \
            --token VERSION=1.2.3 \
            --token PKGREL=1 \
            --token SOURCE_SHA256=abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789 \
            --label 'wayscriber-configurator template pair (normal release)' \
            --builder-user builder \
            --work-root /tmp/srcinfo-canonical \
            --refresh-task 'render PKGBUILD.tmpl, run makepkg --printsrcinfo on it, and re-tokenize the result into .SRCINFO.tmpl'

      - name: Canonical .SRCINFO - AUR template pair (hotfix)
        run: |
          ./tools/check-srcinfo-canonical.py \
            --pkgbuild packaging/aur/wayscriber-configurator/PKGBUILD.tmpl \
            --srcinfo packaging/aur/wayscriber-configurator/.SRCINFO.tmpl \
            --token VERSION=1.2.3.1 \
            --token PKGREL=4 \
            --token SOURCE_SHA256=abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789 \
            --label 'wayscriber-configurator template pair (hotfix)' \
            --builder-user builder \
            --work-root /tmp/srcinfo-canonical \
            --refresh-task 'render PKGBUILD.tmpl, run makepkg --printsrcinfo on it, and re-tokenize the result into .SRCINFO.tmpl'

  nix-flake:
    name: Nix flake
    runs-on: ubuntu-latest
    # A real (not dry-run) configurator build compiles the whole GTK4 stack from
    # whatever the nixpkgs channel provides, which does not fit in 20 minutes on
    # a cold cache.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake package versions
        run: |
          cargo_version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          wayscriber_version="$(nix eval .#packages.x86_64-linux.wayscriber.version --raw)"
          configurator_version="$(nix eval .#packages.x86_64-linux.wayscriber-configurator.version --raw)"

          test "$wayscriber_version" = "$cargo_version"
          test "$configurator_version" = "$cargo_version"

      - name: Check flake package instantiation
        run: nix build .#wayscriber .#wayscriber-configurator --no-link --dry-run

      - name: Build configurator package
        # The dry-run above only evaluates. This is the one place the flake's
        # `buildFeatures` conditional is actually compiled, so a channel whose
        # libadwaita crosses 1.7 flips the feature on under a real build.
        run: nix build .#wayscriber-configurator --no-link
