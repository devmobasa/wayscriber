name: Held-buffer integration

on:
  pull_request:
  workflow_dispatch:

jobs:
  held-buffers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install headless compositor and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sway libwayland-bin libwayland-dev libxkbcommon-dev \
            libcairo2-dev libpango1.0-dev libglib2.0-dev libssl-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Build the app and companion without desktop optional features
        run: cargo build --locked --no-default-features -p wayscriber -p wayscriber-process-broker --bins

      - name: Exercise delayed releases during resize and fractional scale
        run: bash tools/integration/held-buffers/test-held-buffers.sh

      - name: Upload isolated failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: held-buffer-logs
          path: /tmp/wb*/*.log
          if-no-files-found: ignore
