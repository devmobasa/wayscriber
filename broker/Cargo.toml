[package]
name = "wayscriber-process-broker"
version = "0.9.26"
edition = "2024"
rust-version = "1.98.1"
publish = false
build = "build.rs"

[lints]
workspace = true

[features]
# Only the main crate's unit tests use this in-process, allowlisted test broker.
# Release packaging builds the broker without this feature.
test-support = []

[dependencies]
anyhow = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "wayscriber-broker"
path = "src/main.rs"
