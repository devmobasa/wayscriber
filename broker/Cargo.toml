[package]
name = "wayscriber-process-broker"
version = "0.9.25"
edition = "2024"
rust-version = "1.98.1"
publish = false
build = "build.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "wayscriber-broker"
path = "src/main.rs"
